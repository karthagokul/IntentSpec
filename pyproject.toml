[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqmd-prototype"
version = "0.1.0"
description = "Experimental Markdown requirements parser and validator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "markdown-it-py>=3.0,<5",
]

[project.scripts]
reqmd = "reqmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
